name: Factual
description: >-
  Factual Inc. was a Los Angeles-based location-data company (backed by a16z, DCVC and
  Index Ventures) that operated the Global Places database and Geopulse audience/location
  APIs, giving developers programmatic access to a worldwide catalog of business points of
  interest, categories, attributes and geotagged mobile audience data. Factual was acquired
  by and merged into Foursquare in 2020; factual.com now redirects to foursquare.com and the
  standalone Factual Places/Geopulse API has been discontinued. This profile preserves the
  historical first-party client drivers (Java, Python, Node.js, Clojure) still published in
  their package registries and captured as real artifacts in the API Evangelist network.
